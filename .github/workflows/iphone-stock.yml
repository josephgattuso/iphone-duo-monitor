name: Monitor iPhone Duo pickup stock

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: iphone-duo-stock-monitor
  cancel-in-progress: true

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Validate Python syntax
        run: python -m py_compile stock_monitor.py

      - name: Check nearby Apple Stores
        env:
          APPLE_POSTCODE: ${{ secrets.APPLE_POSTCODE }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APPLE_PRODUCT_URL: "https://www.apple.com/uk/shop/buy-iphone/iphone-duo"
          PREFERRED_COLOUR: "Night Sky"
          PREFERRED_STORAGE: "512GB"
          CHECK_ALTERNATIVES: "true"
          HEADLESS: "true"
        run: python stock_monitor.py
